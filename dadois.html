<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label for="input">Informe seu nome</label>
    <input type="text" id="input" placeholder="Digite seu nome">
    <button id="salvar">Salvar</button>
    <button id="recuperar">Recuperar</button>

    <p id="nome"></p>

    <script>

        let listaNomes = [];
        const input = document.getElementById("input");
        const salvar = document.getElementById("salvar");
        const recuperar = document.getElementById("recuperar");
        const nome = document.getElementById("nome");

        salvar.addEventListener("click", ()=> {
            listaNomes.push(input.value);
            localStorage.setItem("nomes", JSON.stringify(listaNomes));
        });

        recuperar.addEventListener("click", ()=> {
            let obj = JSON.parse(localStorage.getItem("nomes"))
            console.log(obj);
            obj.forEach(element => {
                nome.innerHTML += " ," + element
            });
        });
    </script>
</body>
</html>
