<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
    </style>
</head>
<body>
    <div class="bgc">
        <button id="button" onclick="obterBg()">Trocar background</button>
    </div>
    <script>
        function obterBg() {
            const corAleatoria = '#' + Math.floor(Math.random()*16777215).toString(16);
            document.body.style.backgroundColor = corAleatoria;
            navigator.clipboard.writeText(corAleatoria);
        }
    </script>
</body>
</html>
