<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        header,footer {
            background-color: #9acd32;
            height: 10vh;
        }

        meio{
            display: flex;
            height: 50vh;
        }

        article {
            flex: 2;
            background-color: #fff;
            padding: 20px;
        }

        aside {
            flex: 1;
            background-color: #d6cd63;
            padding: 20px;
        }

        nav {
            flex: 1;
            background-color: #9bcfff;
            padding: 20px;
        }

        footer {
            text-align: left;
            padding: 20px;
        }
    </style>
</head>

<body>
    <header>Header</header>

    <meio>
        <article>Article</article>
        <aside>Aside</aside>
        <nav>Nav</nav>
    </meio>

    <footer>Footer</footer>
</body>

</html>
