<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            text-align: center;
            height: 90px;
            font: 600 20px/90px system-ui;
        }
    </style>
</head>

<body>
    <div style="background-color: purple;">1</div>
    <div style="background-color: green;">2</div>
    <div style="background-color: red;">3</div>
    <div style="background-color: yellow;">4</div>

    <h1>Explicação:</h1>
    <p>A div por padrão tem como display o Block, cada uma quebra linha e ocupa 100% da largura</p>
    <p>A cor de fundo esta sendo setada com background-color em cada uma das divs</p>
    <p>O texto esta no centro por causa do <span style="font-weight: bold;">text-align: center;</span> e pelo <span style="font-weight: bold;">font: 600 20px/90px system-ui;</span></p>
</body>

</html>
